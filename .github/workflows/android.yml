name: Android agent APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK at $ANDROID_SDK_ROOT. Make sure the
      # exact platform/build-tools this app targets are present.
      - name: Ensure SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      # Stable signing (required for device-owner QR provisioning and in-place upgrades).
      # Secrets: MDM_KEYSTORE_BASE64 (base64 of the .jks), MDM_KEYSTORE_PASSWORD, MDM_KEY_ALIAS,
      # MDM_KEY_PASSWORD (optional, defaults to the store password). Without them CI falls back to a
      # debug build signed with the runner's throwaway debug key (fine for testing, NOT for provisioning).
      - name: Decode signing keystore
        id: keystore
        env:
          MDM_KEYSTORE_BASE64: ${{ secrets.MDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MDM_KEYSTORE_BASE64" ]; then
            echo "$MDM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mdm-release.jks"
            echo "path=$RUNNER_TEMP/mdm-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MDM_KEYSTORE_BASE64 not set; building a debug APK instead of a signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Optional: set the repository variable MDM_APP_LINK_HOST to your web host
      # (e.g. enroll.example.com) so https://<host>/enroll/<token> opens the app.
      - name: Build APK
        env:
          APP_LINK_HOST: ${{ vars.MDM_APP_LINK_HOST }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          MDM_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MDM_KEYSTORE_PASSWORD: ${{ secrets.MDM_KEYSTORE_PASSWORD }}
          MDM_KEY_ALIAS: ${{ secrets.MDM_KEY_ALIAS }}
          MDM_KEY_PASSWORD: ${{ secrets.MDM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew scripts/signature-checksum.sh
          EXTRA="-Pmdm.versionCode=${{ github.run_number }}"
          if [ -n "$APP_LINK_HOST" ]; then EXTRA="$EXTRA -Pmdm.appLinkHost=$APP_LINK_HOST"; fi
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease $EXTRA --stacktrace --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/mdm-agent.apk
          else
            ./gradlew assembleDebug $EXTRA --stacktrace --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk dist/mdm-agent.apk
            # Old download links keep working.
            cp dist/mdm-agent.apk dist/mdm-agent-debug.apk
          fi

      - name: Verify signature and print APP_SIGNATURE_CHECKSUM
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs dist/mdm-agent.apk
          CHECKSUM="$(APKSIGNER="$APKSIGNER" scripts/signature-checksum.sh dist/mdm-agent.apk)"
          echo "APP_SIGNATURE_CHECKSUM=$CHECKSUM"
          echo "### APP_SIGNATURE_CHECKSUM" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$CHECKSUM\` (signed release: ${{ steps.keystore.outputs.signed }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-apk
          path: apps/android/dist/*.apk
          if-no-files-found: error

      # Publish to a stable "latest" release so the enrollment page and the provisioning QR can link to
      #   https://github.com/<owner>/<repo>/releases/download/latest/mdm-agent.apk
      - name: Move the latest tag to this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Publish APK to latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MDM Agent (latest build)
          prerelease: false
          make_latest: true
          body: |
            Auto-built APK of the MDM Agent from ${{ github.sha }} (signed release: ${{ steps.keystore.outputs.signed }}).
            Install on Android 8.0+ (allow installing from this source), then open your enrollment link or scan the QR code.
            Company-owned devices: scan the provisioning QR on a factory-reset phone (tap the welcome screen 6 times).
          files: apps/android/dist/*.apk
